# Redis memory cap and eviction for chat session store
# Apply this so Redis never uses more than 500MB.

# Maximum memory Redis can use (500MB)
maxmemory 500mb

# When maxmemory is reached: evict keys that have an expire set (our session keys),
# by least recently used (LRU). New writes succeed; evicted sessions lose
# history until the user messages again (a new key is created).
maxmemory-policy volatile-lru
